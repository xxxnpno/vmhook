name: Windows GNU C++

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release
          -DVMHOOK_BUILD_MODULE=${{ matrix.module }}
          -DBUILD_TESTING=ON
          -DVMHOOK_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Install header package
        shell: msys2 {0}
        run: cmake --install build --prefix build/install

  runtime:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "17", "21", "25", "27"]
        module: ["OFF", "ON"]
        include:
          - module: "OFF"
            probe: vmhook_probe.dll
          - module: "ON"
            probe: vmhook_module_probe.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Configure injected runtime tests
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVMHOOK_BUILD_RUNTIME_TESTS=ON
          -DVMHOOK_BUILD_MODULE=${{ matrix.module }}
          -DVMHOOK_WARNINGS_AS_ERRORS=ON
      - name: Build
        id: build
        shell: msys2 {0}
        run: cmake --build build --parallel
      - name: Inspect an ordinary JVM without JNI
        shell: msys2 {0}
        run: >-
          python tests/runtime/run.py
          --java "$JAVA_HOME/bin/java.exe"
          --javac "$JAVA_HOME/bin/javac.exe"
          --injector build/tests/vmhook_test_injector.exe
          --probe build/tests/${{ matrix.probe }}
          --metadata-only
      - name: Verify hooks and queued native callbacks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: msys2 {0}
        run: >-
          python tests/runtime/run.py
          --java "$JAVA_HOME/bin/java.exe"
          --javac "$JAVA_HOME/bin/javac.exe"
          --injector build/tests/vmhook_test_injector.exe
          --probe build/tests/${{ matrix.probe }}
          --hooks-only
      - name: Verify Java invocation, construction, and GC behavior
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: msys2 {0}
        run: >-
          python tests/runtime/run.py
          --java "$JAVA_HOME/bin/java.exe"
          --javac "$JAVA_HOME/bin/javac.exe"
          --injector build/tests/vmhook_test_injector.exe
          --probe build/tests/${{ matrix.probe }}
